<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Protótipo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Protótipo do Player</title>
  <style>
    :root { --bg: #111; --fg: #eee; --muted: #999; --accent: #f5a524; --line: #333; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 -apple-system, system-ui, sans-serif;
           padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .muted { color: var(--muted); font-size: 14px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    button { min-height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 10px;
             background: #222; color: var(--fg); font: inherit; }
    button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
    button:disabled { opacity: .4; }
    ol { padding-left: 24px; }
    li { padding: 6px 0; }
    li.now { color: var(--accent); font-weight: 600; }
    audio { width: 100%; margin: 8px 0; }
    fieldset { border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; padding: 8px 12px; }
    fieldset label { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
    fieldset input { width: 22px; height: 22px; }
    #log { white-space: pre-wrap; font: 12px/1.4 ui-monospace, Menlo, monospace; background: #000; border: 1px solid var(--line);
           border-radius: 8px; padding: 8px; max-height: 40vh; overflow: auto; }
  </style>
</head>
<body>
  <h1>Protótipo do Player</h1>
  <p class="muted" id="mode"></p>

  <div class="row">
    <button class="primary" id="loginRedirect">Entrar (redirecionamento)</button>
    <button id="loginPopup">Entrar (popup)</button>
  </div>

  <div class="row">
    <button id="list" disabled>Listar pasta Músicas</button>
    <button id="playAll" disabled>Tocar tudo</button>
  </div>

  <fieldset>
    <legend>Experimentos (som mudo com a tela bloqueada)</legend>
    <label><input type="checkbox" id="optSession"> Sessão de áudio "playback"</label><br>
    <label><input type="checkbox" id="optTwo"> Dois elementos de áudio (sobreposição)</label>
  </fieldset>

  <!-- sem "controls": os controles nativos parecem trazer os botões de ±10 s para a tela de bloqueio -->
  <audio id="audio" playsinline></audio>
  <div class="row" style="align-items:center">
    <button id="prev" aria-label="Música anterior">⏮</button>
    <button id="playPause" aria-label="Tocar ou pausar">▶︎</button>
    <button id="next" aria-label="Próxima música">⏭</button>
    <span class="muted" id="time">0:00 / 0:00</span>
  </div>
  <ol id="tracks"></ol>

  <div class="row">
    <button id="clearLog">Limpar registro</button>
  </div>
  <div id="log" aria-live="polite"></div>

  <script type="module" src="proto.js?v=4"></script>
</body>
</html>
