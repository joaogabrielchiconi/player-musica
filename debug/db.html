<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Teste do banco</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font: 16px/1.4 -apple-system, system-ui, sans-serif;
           padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); }
    h1 { font-size: 20px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    button { min-height: 44px; padding: 0 16px; border: 1px solid #333; border-radius: 10px; background: #222; color: #eee; font: inherit; }
    #out { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, monospace; background: #000; border: 1px solid #333; border-radius: 8px; padding: 8px; }
  </style>
</head>
<body>
  <h1>Teste do banco (T2)</h1>
  <div class="row">
    <button id="write">1. Gravar 10 MB</button>
    <button id="read">2. Ler de volta</button>
    <button id="clear">Apagar teste</button>
  </div>
  <div id="out" aria-live="polite"></div>

  <script type="module">
    import { get, put, del, keys, persist } from '../js/db.js';

    const SIZE = 10 * 1024 * 1024;
    const byteAt = (i) => (i * 31 + 7) & 255; // padrão conhecido para conferir a leitura
    const out = document.getElementById('out');
    const say = (msg) => { out.textContent += `${new Date().toLocaleTimeString('pt-BR')} ${msg}\n`; };
    const fail = (err) => say(`ERRO: ${err.message ?? err}`);

    async function status() {
      say(`persistente: ${await persist()}`);
      if (navigator.storage?.estimate) {
        const { usage, quota } = await navigator.storage.estimate();
        say(`uso: ${(usage / 1048576).toFixed(1)} MB de ${(quota / 1048576).toFixed(0)} MB`);
      }
      say(`chaves em audio: ${JSON.stringify(await keys('audio'))}`);
    }

    document.getElementById('write').onclick = async () => {
      try {
        const bytes = new Uint8Array(SIZE);
        for (let i = 0; i < SIZE; i++) bytes[i] = byteAt(i);
        await put('audio', 'teste', new Blob([bytes], { type: 'audio/mpeg' }));
        await put('meta', 'teste-gravado-em', new Date().toISOString());
        say('gravou 10 MB. Agora feche o Safari pelo seletor de apps, abra de novo esta página e toque em "2. Ler de volta".');
        await status();
      } catch (err) { fail(err); }
    };

    document.getElementById('read').onclick = async () => {
      try {
        const blob = await get('audio', 'teste');
        if (!blob) return say('nada gravado ainda (ou os dados foram apagados).');
        const bytes = new Uint8Array(await blob.arrayBuffer());
        let ok = bytes.length === SIZE;
        for (let n = 0; ok && n < 1000; n++) {
          const i = Math.floor((n / 1000) * SIZE);
          if (bytes[i] !== byteAt(i)) ok = false;
        }
        say(`gravado em ${await get('meta', 'teste-gravado-em')}`);
        say(ok ? `OK: ${bytes.length} bytes lidos, conteúdo confere.` : `FALHOU: tamanho ${bytes.length} ou conteúdo diferente.`);
      } catch (err) { fail(err); }
    };

    document.getElementById('clear').onclick = async () => {
      try { await del('audio', 'teste'); await del('meta', 'teste-gravado-em'); say('teste apagado.'); await status(); }
      catch (err) { fail(err); }
    };

    status().catch(fail);
  </script>
</body>
</html>
