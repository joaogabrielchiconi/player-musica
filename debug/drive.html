<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Teste do login e Drive</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font: 16px/1.4 -apple-system, system-ui, sans-serif;
           padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); }
    h1 { font-size: 20px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    button { min-height: 44px; padding: 0 16px; border: 1px solid #333; border-radius: 10px; background: #222; color: #eee; font: inherit; }
    #covers figure { display: flex; gap: 12px; align-items: center; margin: 12px 0; }
    #covers img, #covers .none { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; background: #222; flex: none; }
    #out { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, monospace; background: #000; border: 1px solid #333; border-radius: 8px; padding: 8px; }
  </style>
</head>
<body>
  <h1>Teste do login e Drive (T3)</h1>
  <div class="row">
    <button id="signin">1. Entrar com Google</button>
    <button id="list">2. Listar Músicas</button>
    <button id="range">3. Ler 64 KB da 1ª faixa</button>
    <button id="expire">4. Simular token vencido</button>
    <button id="tags">5. Ler tags (T4)</button>
    <button id="dump">6. Ver tag por dentro</button>
  </div>
  <div id="out" aria-live="polite"></div>
  <div id="covers"></div>

  <script type="module">
    import { signIn, getToken, tokenMinutesLeft, clearToken } from '../js/auth.js';
    import { createDrive } from '../js/drive.js';
    import { put, get } from '../js/db.js';
    import { readTags } from '../js/tags.js';

    const out = document.getElementById('out');
    const say = (msg) => { out.textContent += `${new Date().toLocaleTimeString('pt-BR')} ${msg}\n`; };
    const fail = (err) => say(`${err.name}: ${err.message}`);
    // Só para este teste: no 401 apaga o token e não renova (renovar exige um toque).
    const drive = createDrive({ getToken, onUnauthorized: () => { clearToken(); return null; } });
    let tracks = [];

    const status = () => say(getToken() ? `logado: token vale mais ${tokenMinutesLeft()} min` : 'não logado');

    document.getElementById('signin').onclick = () => {
      signIn().then(() => { say('login OK'); status(); }).catch(fail);
    };

    document.getElementById('list').onclick = async () => {
      try {
        const t0 = performance.now();
        const folderId = await drive.findFolder('Músicas');
        if (!folderId) return say('pasta Músicas não encontrada na raiz do Drive');
        await put('meta', 'folderId', folderId); // fica só neste aparelho
        tracks = await drive.listAudio(folderId);
        say(`${tracks.length} faixa(s) em ${((performance.now() - t0) / 1000).toFixed(1)} s:`);
        for (const t of tracks) say(`  ${t.folder ? t.folder + '/' : ''}${t.name} (${(t.size / 1048576).toFixed(1)} MB)`);
      } catch (err) { fail(err); }
    };

    document.getElementById('range').onclick = async () => {
      try {
        if (!tracks.length) return say('liste a pasta antes (botão 2)');
        const buf = await drive.downloadRange(tracks[0].id, 0, 65535);
        const head = new TextDecoder('latin1').decode(new Uint8Array(buf, 0, 3));
        say(`leu ${buf.byteLength} bytes de "${tracks[0].name}" · começa com "${head}" ${head === 'ID3' ? '(tem tag ID3)' : ''}`);
      } catch (err) { fail(err); }
    };

    document.getElementById('expire').onclick = async () => {
      // Token inválido mas com validade futura: o Drive responde 401, como acontece depois de 1 h.
      localStorage.setItem('auth_token', JSON.stringify({ value: 'token-falso', expiresAt: Date.now() + 3600_000 }));
      say('token trocado por um inválido; listando…');
      try { await drive.listAudio((await get('meta', 'folderId')) ?? 'root'); say('ERRO: deveria ter falhado'); }
      catch (err) {
        fail(err);
        say(`token apagado: ${getToken() === null} · pasta ainda salva no aparelho: ${Boolean(await get('meta', 'folderId'))}`);
        say('Agora toque em "1. Entrar com Google" de novo.');
      }
    };

    document.getElementById('tags').onclick = async () => {
      if (!tracks.length) return say('liste a pasta antes (botão 2)');
      const covers = document.getElementById('covers');
      covers.textContent = '';
      for (const file of tracks) {
        try {
          const t0 = performance.now();
          const t = await readTags(file, drive);
          const fig = document.createElement('figure');
          const img = t.art ? Object.assign(document.createElement('img'), { src: URL.createObjectURL(t.art), alt: 'Capa' }) : Object.assign(document.createElement('div'), { className: 'none' });
          const cap = document.createElement('figcaption');
          cap.textContent = `${t.title} · ${t.artist} · ${t.album}${t.trackNo ? ` · faixa ${t.trackNo}` : ''} · capa: ${t.art ? `${(t.art.size / 1024).toFixed(0)} KB` : 'não'} · ${((performance.now() - t0) / 1000).toFixed(1)} s`;
          fig.append(img, cap);
          covers.append(fig);
        } catch (err) { fail(err); }
      }
      say('tags lidas (veja abaixo do registro)');
    };

    // Diagnóstico: lista os frames da tag ID3 de cada faixa (id, tamanho, começo do conteúdo).
    document.getElementById('dump').onclick = async () => {
      if (!tracks.length) return say('liste a pasta antes (botão 2)');
      const hex = (b) => [...b].map((x) => x.toString(16).padStart(2, '0')).join(' ');
      for (const file of tracks) {
        try {
          const b = new Uint8Array(await drive.downloadRange(file.id, 0, 65535));
          say(`— ${file.name}`);
          say(`  início: ${hex(b.subarray(0, 10))}`);
          if (String.fromCharCode(b[0], b[1], b[2]) !== 'ID3') { say('  sem tag ID3v2 no início'); continue; }
          const ver = b[3], flags = b[5];
          const ss = (i) => ((b[i] & 127) << 21) | ((b[i + 1] & 127) << 14) | ((b[i + 2] & 127) << 7) | (b[i + 3] & 127);
          const be = (i) => ((b[i] << 24) | (b[i + 1] << 16) | (b[i + 2] << 8) | b[i + 3]) >>> 0;
          say(`  ID3v2.${ver} · flags ${flags.toString(2)} · tamanho ${ss(6)}`);
          let p = 10;
          const end = Math.min(b.length, 10 + ss(6));
          for (let n = 0; n < 30 && p + 10 <= end && b[p] !== 0; n++) {
            const id = ver === 2 ? String.fromCharCode(...b.subarray(p, p + 3)) : String.fromCharCode(...b.subarray(p, p + 4));
            const size = ver === 2 ? (b[p + 3] << 16) | (b[p + 4] << 8) | b[p + 5] : ver === 4 ? ss(p + 4) : be(p + 4);
            const head = ver === 2 ? 6 : 10;
            const data = b.subarray(p + head, p + head + Math.min(size, 48));
            const txt = new TextDecoder('latin1').decode(data).replace(/[\x00-\x1f]/g, '·');
            say(`  ${id} (${size} B): ${txt}`);
            p += head + size;
          }
        } catch (err) { fail(err); }
      }
    };

    status();
  </script>
</body>
</html>
