<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Player de Música</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <h1>Músicas</h1>
    <div class="actions">
      <button id="signin" hidden>Entrar com Google</button>
      <button id="sync" hidden>Atualizar biblioteca</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
  </header>
  <main>
    <ul class="tracks" id="tracks"></ul>
  </main>
  <!-- Esta página também é o retorno do login do Google (REDIRECT_URI): app.js trata isso primeiro. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
