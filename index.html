<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Player de Música</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <button id="back" class="back" hidden>‹ Voltar</button>
    <h1 id="title">Músicas</h1>
    <div class="actions">
      <button id="signin" hidden>Entrar com Google</button>
      <button id="sync" hidden>Atualizar biblioteca</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <input id="search" class="search" type="search" placeholder="Buscar música, artista ou álbum" aria-label="Buscar" autocomplete="off">
    <label class="filter"><input id="onlyDownloaded" type="checkbox"> Só baixadas</label>
  </header>
  <main id="library"></main>
  <p id="toast" class="toast" role="status" hidden></p>
  <footer class="bottom">
    <div class="mini" id="mini" hidden>
      <button id="miniOpen" class="mini-info" aria-label="Abrir o player">
        <span id="miniTitle" class="title"></span><span id="miniSub" class="sub"></span>
      </button>
      <button id="miniToggle" aria-label="Pausar">⏸︎</button>
      <button id="miniNext" aria-label="Próxima">⏭︎</button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="songs" aria-selected="true">Músicas</button>
      <button role="tab" data-tab="artists" aria-selected="false">Artistas</button>
      <button role="tab" data-tab="albums" aria-selected="false">Álbuns</button>
    </nav>
  </footer>
  <section id="full" class="full" hidden aria-label="Tocando agora">
    <button id="fullClose" class="back">⌄ Fechar</button>
    <div class="full-cover" id="fullCover"></div>
    <p id="fullTitle" class="full-title"></p>
    <p id="fullSub" class="sub"></p>
    <input id="seek" class="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Posição na música">
    <div class="times"><span id="tNow">0:00</span><span id="tEnd">0:00</span></div>
    <div class="controls">
      <button id="shuffle" aria-pressed="false" aria-label="Aleatório">🔀︎</button>
      <button id="prev" aria-label="Anterior">⏮︎</button>
      <button id="toggle" class="big" aria-label="Pausar">⏸︎</button>
      <button id="next" aria-label="Próxima">⏭︎</button>
      <button id="repeat" aria-pressed="false" aria-label="Repetir: desligado">🔁︎</button>
    </div>
    <h2 class="queue-head">Fila</h2>
    <ol id="queue" class="tracks queue"></ol>
  </section>
  <audio id="audio" playsinline preload="auto"></audio>
  <!-- Esta página também é o retorno do login do Google (REDIRECT_URI): app.js trata isso primeiro. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
